name: Checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm install -g pnpm@12.18.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web lint
      - run: pnpm --filter web build
      - name: Syntax-check the API and shared code
        run: |
          for f in $(find apps/api/src apps/shared apps/cli/src -name '*.js' -o -name '*.cjs' -o -name '*.mjs' | grep -v node_modules); do
            node --check "$f"
          done
      - run: pnpm audit --prod
